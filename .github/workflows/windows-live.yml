# TaoOps 云端 Windows 真机验证（ci/cloud-linux 分支专用，FR-A31 / 台账 G4）
# 目的：用 windows runner 作为 Windows 实弹环境，验证 Windows 版中控：
#  - win-x64 自包含发布 + 界面随中控分发
#  - 服务注册（sc create start= auto）→ 服务运行 → 面板端口可达
#  - 自启配置核查（START_TYPE = AUTO_START）
#  - 卸载六项清理：服务/自启/注册表/防火墙/文件/数据目录
name: windows-live

on:
  workflow_dispatch: {}

jobs:
  windows-live:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建 .NET 全量回归
        run: |
          dotnet build TaoOps.slnx -c Release
          dotnet test --no-restore -c Release

      - name: 发布 win-x64 自包含
        run: dotnet publish server/TaoOps.Server.csproj -c Release -r win-x64 --self-contained true -o dist/TaoOps

      - name: 构建网页界面并随中控分发
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          Copy-Item -Recurse -Force web/dist dist/TaoOps/web

      - name: 安装——注册服务并设自启
        run: |
          $exe = (Get-ChildItem -Recurse -Filter TaoOps.Server.exe dist | Select-Object -First 1).FullName
          Write-Host "service exe: $exe"
          sc.exe create TaoOps binPath= "`"$exe`"" start= auto DisplayName= "TaoOps Server"
          if ($LASTEXITCODE -ne 0) { throw "sc create failed: $LASTEXITCODE" }
          sc.exe description TaoOps "TaoOps server panel host"
          netsh.exe advfirewall firewall add rule name="TaoOps" dir=in action=allow protocol=TCP localport=5241
          if ($LASTEXITCODE -ne 0) { throw "netsh add rule failed" }

      - name: 启动服务并验证面板可达
        run: |
          sc.exe start TaoOps
          if ($LASTEXITCODE -ne 0) { throw "sc start failed: $LASTEXITCODE" }
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $res = Invoke-WebRequest -Uri "https://localhost:5241/" -SkipCertificateCheck -UseBasicParsing -TimeoutSec 5
              if ($res.StatusCode -eq 200) { $ok = $true; break }
            } catch { Write-Host "waiting: $_" }
          }
          if (-not $ok) { throw "panel not reachable on 5241 after 60s" }
          Write-Host "PANEL-OK status=200"

      - name: 自启配置核查
        run: |
          $qc = sc.exe qc TaoOps | Out-String
          Write-Host $qc
          if ($qc -notmatch "AUTO_START") { throw "service is not AUTO_START" }
          Write-Host "AUTOSTART-OK"

      - name: 界面自带核查
        run: |
          $pathName = (Get-CimInstance Win32_Service -Filter "Name='TaoOps'").PathName
          $exeDir = Split-Path ($pathName.Trim('"') -replace ' -.*$','') -Parent
          if (-not (Test-Path (Join-Path $exeDir "web\index.html"))) { throw "bundled web/ missing next to service exe: $exeDir" }
          Write-Host "BUNDLED-WEB-OK at $exeDir"

      - name: 卸载——清理
        run: |
          sc.exe stop TaoOps
          sc.exe delete TaoOps
          if ($LASTEXITCODE -ne 0) { throw "sc delete failed: $LASTEXITCODE" }
          netsh.exe advfirewall firewall delete rule name="TaoOps"
          if ($LASTEXITCODE -ne 0) { throw "netsh delete rule failed" }
          Start-Sleep -Seconds 5

      - name: 残留核查
        run: |
          $fail = @()
          if (Get-Service TaoOps -ErrorAction SilentlyContinue) { $fail += "service still exists" }
          if (Test-Path "HKLM:\SYSTEM\CurrentControlSet\Services\TaoOps") { $fail += "service registry key remains" }
          if (Test-Path "HKLM:\SOFTWARE\TaoOps") { $fail += "software registry key remains" }
          $fw = netsh.exe advfirewall firewall show rule name="TaoOps" | Out-String
          if ($fw -notmatch "No rules match") { $fail += "firewall rule remains" }
          if ($fail.Count -gt 0) { throw "RESIDUE FOUND: $($fail -join '; ')" }
          Write-Host "UNINSTALL-CLEAN-OK: service/registry/firewall all clean"

      - name: 验证小结
        if: always()
        run: |
          "## Windows live-fire summary" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "PANEL-OK / AUTOSTART-OK / BUNDLED-WEB-OK / UNINSTALL-CLEAN-OK see step statuses" | Out-File $env:GITHUB_STEP_SUMMARY -Append
