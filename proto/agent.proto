syntax = "proto3";

package taoops.v1;

option csharp_namespace = "TaoOps.Server.Grpc";
option go_package = "taoops/agent/pb;pb";

// 契约正源：src/docs/protocol-contract.md（改协议先改文档）
service AgentService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(stream HeartbeatMsg) returns (stream HeartbeatAck);
  rpc Dispatch(DispatchRequest) returns (DispatchResult);
  rpc CommandStream(stream DispatchResult) returns (stream DispatchRequest);
  // 终端双向流（M2）：Agent 发送终端输出、接收键盘输入；字节流，方向无关。
  rpc TermStream(stream TermData) returns (stream TermData);
  // 日志流（M2）：Agent 发送日志块，接收订阅控制（中控按控制台请求转发）。
  rpc LogStream(stream LogChunk) returns (stream LogControl);
}

message RegisterRequest {
  string agent_id = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string version = 5;
  repeated string tags = 6;
}

message NodeConfig {
  int32 heartbeat_interval_ms = 1;
}

message RegisterResponse {
  string node_id = 1;
  NodeConfig config = 2;
}

message HeartbeatMsg {
  string node_id = 1;
  int64 ts = 2;
  double cpu = 3;
  double mem = 4;
  double disk = 5;
  double load = 6;
}

message HeartbeatAck {
  int64 ts = 1;
}

message DispatchRequest {
  string node_id = 1;
  string command = 2;
  repeated string args = 3;
  int32 timeout_ms = 4;
  string request_id = 5;
}

message DispatchResult {
  int32 exit_code = 1;
  string output = 2;
  string request_id = 3;
}

// 终端双向流（M2）：Agent 发送终端输出、接收键盘输入；字节流，方向无关。
message TermData {
  string node_id = 1;
  string session_id = 2;
  bytes data = 3;
}

// 日志块（M2）：Agent 推送的增量日志。
message LogChunk {
  string node_id = 1;
  bytes data = 2;
  int64 ts = 3;
}

// 日志订阅控制（M2）：中控下发给 Agent 的订阅/退订指令。
message LogControl {
  string action = 1;
  string path = 2;
  int32 tail_lines = 3;
}
